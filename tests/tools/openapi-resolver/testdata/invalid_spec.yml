openapi: 3.0.0
info:
  title: Invalid Test API
  version: 1.0.0

paths:
  /test:
    get:
      # operationIdが欠落している
      summary: Missing operation ID
      responses:
        '200':
          description: Success
  
  /invalid-method:
    # 不正なHTTPメソッド
    invalid:
      operationId: InvalidMethod
      summary: Invalid HTTP method
      responses:
        '200':
          description: Success
  
  # パスパラメータが定義されていないのにパスに含まれている
  /missing-param-def/{id}:
    get:
      operationId: MissingParamDef
      summary: Missing parameter definition
      # parametersセクションがない
      responses:
        '200':
          description: Success
