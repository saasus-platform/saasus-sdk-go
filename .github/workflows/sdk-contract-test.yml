# SDK contract test (A)(B)(C) calling workflow.
#
# This thin file lives in the SDK repository. The language-agnostic steps
# (fetch spec, start Prism, resolve the previous release tag) come from the
# central reusable repo saasus-platform/github-actions. The Go-specific
# generate/build/test steps stay here.
#
# What it checks:
#   (A) the latest SDK generates from the current OpenAPI spec and builds
#   (B) the latest SDK's requests are accepted by the mock and responses deserialize
#   (C) the previously released SDK still round-trips against the latest spec
#
# Security:
#   - pull_request only (never pull_request_target); fork PRs do not receive secrets.
#   - the job name below is fixed so it can be set as a required status check.
#   - the api read token is masked; no response body, spec body or PII is printed.

name: SDK Contract Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: sdk-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job name "contract-test" is the required status check name. Do not rename.
  contract-test:
    name: contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR (latest SDK)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Set up Node (for Prism via npx)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # Short-lived installation token (contents:read on the private api repo only).
      - name: Mint api read token
        id: api-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.SPEC_READER_APP_ID }}
          private-key: ${{ secrets.SPEC_READER_PRIVATE_KEY }}
          owner: Anti-Pattern-Inc
          repositories: saasus-api

      # The api repository and its latest stable tag are resolved inside the action.
      #
      # TODO(before un-drafting): drop the `ref` below so the latest stable api
      # tag is used again. It is pinned to the head of
      # Anti-Pattern-Inc/saasus-api#2650, which makes the pricing oneOf
      # discriminable and fixes string examples written as numbers. Remove once
      # that is released in a tag.
      - name: Fetch OpenAPI spec
        id: spec
        uses: saasus-platform/github-actions/.github/actions/fetch-openapi-spec@3828a6f1321f954cbb32e8cb3bd253593d5fa0c1 # github-actions main
        with:
          token: ${{ steps.api-token.outputs.token }}
          ref: 322cd2de8e0e7ee5a2277f63632157c0060e3c6d
          dest: openapi-spec

      # (A) Generate the latest SDK from the fetched spec and build/type-check it.
      # generate_all.sh pins the generator version and aborts on any failure.
      - name: (A) Generate latest SDK and build
        env:
          SPEC_DIR: ${{ steps.spec.outputs.spec-dir }}
        run: |
          set -euo pipefail
          bash generate_all.sh
          go build ./...
          go vet ./...

      # Static mode: responses come from the spec's examples, which is how the
      # spec makes oneOf responses resolvable. Dynamic mode would ignore them.
      - name: Start Prism mocks
        uses: saasus-platform/github-actions/.github/actions/setup-prism@3828a6f1321f954cbb32e8cb3bd253593d5fa0c1 # github-actions main
        with:
          spec-dir: ${{ steps.spec.outputs.spec-dir }}
          modules: ${{ steps.spec.outputs.modules }}
          base-port: "4010"

      # (B) Latest SDK: requests accepted + responses deserialize. The suite
      # enumerates every operation from the spec and reads the per-module mock
      # URLs from the PRISM_URL_<MODULE> variables exported above.
      - name: (B) Latest SDK contract
        env:
          CONTRACT_SPEC_DIR: ${{ steps.spec.outputs.spec-dir }}
          # The latest SDK must cover every spec operation.
          CONTRACT_REQUIRE_COMPLETE: "true"
        run: go test ./contract/ -v

      - name: Resolve previous SDK stable tag
        id: old-tag
        uses: saasus-platform/github-actions/.github/actions/resolve-latest-stable-tag@3828a6f1321f954cbb32e8cb3bd253593d5fa0c1 # github-actions main

      - name: Checkout old SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.old-tag.outputs.tag }}
          path: old-sdk

      # (C) Forward compatibility: the previously released SDK must still
      # round-trip against the LATEST spec. The old tag's OWN bundled suite is
      # run (the current one is not copied into it), so each release is checked
      # with the test it shipped with. Prism was started above from the latest
      # spec, and CONTRACT_SPEC_DIR points at that spec.
      #
      # A tag published before the suite existed has no ./contract package and
      # fails here by design: there is no skip mechanism, the transition is
      # resolved by publishing a tag from main once this is merged.
      - name: (C) Old SDK forward-compat (bundled suite)
        env:
          CONTRACT_SPEC_DIR: ${{ steps.spec.outputs.spec-dir }}
        working-directory: old-sdk
        run: go test ./contract/ -v
